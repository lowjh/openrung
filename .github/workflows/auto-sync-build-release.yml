# Auto sync openrung upstream, build macOS DMG and publish a tagged release.
# Triggered daily (UTC 02:00 = Beijing 10:00) or manually via workflow_dispatch.

name: Auto Sync & Build DMG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openrung-auto-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream to fork
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream main
        id: sync
        env:
          # 推送合并结果必须使用带 workflows 权限的 PAT。
          # 默认的 GITHUB_TOKEN 永远没有 workflows 权限，
          # 上游一旦改动 .github/workflows/ 下的文件，直接用
          # GITHUB_TOKEN push 会被 GitHub 拒绝（本次失败的根因）。
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openrung/openrung.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream already merged; nothing to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --ff-only upstream/main || git merge upstream/main --no-edit
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin main
            echo "synced and pushed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build DMG and publish release
    runs-on: macos-14
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build desktop app
        working-directory: desktop
        run: |
          # Move versionprobe (an independent main package) out of the module
          # tree so Wails does not mis-scan it during type checking.
          if [ -d scripts/versionprobe ]; then
            mv scripts/versionprobe ../versionprobe.bak
          fi
          node scripts/versioned-wails-build.mjs

      - name: Package DMG
        run: |
          hdiutil create -volname OpenRung -srcfolder desktop/build/bin/OpenRung.app \
            -ov -format UDZO OpenRung.dmg
          ls -lh OpenRung.dmg

      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="auto-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" OpenRung.dmg \
            --repo "${{ github.repository }}" \
            --title "OpenRung auto build ($TAG)" \
            --notes "自动同步 openrung 官方仓库后构建的 macOS arm64 DMG。首次打开如被 Gatekeeper 拦截：右键点击 OpenRung.app -> 打开。" || true
